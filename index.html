<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Slot Machine</title>
</head>
<body>
    <h2>Uangmu: Rp<span id="money"></span></h2>
    <main>
        <div id="information">
            <p class="poin">🍋🍋🍋= Rp1.000.000+</p>
            <p class="poin">🍈🍈🍈= Rp2.000.000+</p>
            <p class="poin">🍉🍉🍉= Rp4.000.000+</p>
            <p class="poin">🍎🍎🍎= Rp6.000.000+</p>
            <p class="poin">🍇🍇🍇= Rp8.000.000+</p>
            <p class="poin">7️⃣7️⃣7️⃣= Rp10.000.000+</p>
            <p>Jika kombinasi bukan salah satu di atas ini, maka Rp100.000-</p>
        </div>
        <div id="box-jackpot">
            <div id="jackpot">
                <div id="first-square" class="square">🍋</div>
                <div id="second-square" class="square">🍋</div>
                <div id="third-square" class="square">🍋</div>
            </div>
            <br>
            <button id="spin-btn" onclick="spin()">Putar</button>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
